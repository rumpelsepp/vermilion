name: setup
description: >
  Installs what PyGObject and pycairo are built with, GTK 4 and
  libadwaita, libmagic (for reuse) (Debian), uv and a Python of uv, and
  the project with `uv sync` (PyGObject and pycairo from PyPI, just)
inputs:
  python-version:
    description: The Python version (of uv); the pinned one (.python-version) if not given.
    required: false

runs:
  using: composite
  steps:
    - name: Install the Debian packages
      shell: bash
      run: |
        apt-get update -y
        apt-get install -y --no-install-recommends build-essential pkg-config \
          libcairo2-dev libgirepository-2.0-dev gir1.2-girepository-3.0 \
          gir1.2-gtk-4.0 gir1.2-adw-1 libasound2t64 libmagic1

    # the Python of uv (with its headers), not the one of Debian; the
    # environment outside the checkout, which reuse lints (without git, it
    # doesn't know .gitignore)
    - name: Configure uv
      shell: bash
      run: |
        echo "UV_PYTHON_PREFERENCE=only-managed" >> "$GITHUB_ENV"
        echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"

    - name: Install uv and Python ${{ inputs.python-version }}
      if: ${{ inputs.python-version != '' }}
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: ${{ inputs.python-version }}

    - name: Install uv and the pinned Python
      if: ${{ inputs.python-version == '' }}
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install the project
      shell: bash
      run: uv sync --locked
