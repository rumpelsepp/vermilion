# The linters and type checks of `just lint`, with the Python versions of
# the tests, in Debian (libadwaita >= 1.7).

name: linters

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  linters:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.14t", "3.15", "3.15t"]

    # 3.15 is not released yet: its jobs only show how far it gets
    continue-on-error: ${{ startsWith(matrix.python-version, '3.15') }}

    runs-on: ubuntu-latest
    container: debian:trixie

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}

      # first: the caches of the others would be files without a licence
      - name: Run reuse lint
        run: uv run just reuse

      - name: Run ruff
        run: uv run just ruff

      - name: Run mypy
        run: uv run just mypy

      - name: Run ty
        run: uv run just ty
