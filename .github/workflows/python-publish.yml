# Publishing a GitHub release uploads the package to PyPI with trusted
# publishing (configure the "release" environment and this workflow as a
# trusted publisher of the project on PyPI; no token is needed).

name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  linters:
    uses: ./.github/workflows/linters.yml

  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: [linters, tests]
    runs-on: ubuntu-latest
    # blueprint-compiler needs PyGObject and the typelibs of GTK 4 and
    # libadwaita
    container: debian:trixie

    steps:
      - uses: actions/checkout@v7

      # the pinned Python (.python-version)
      - uses: ./.github/actions/setup

      # the package contains the .ui files compiled from the Blueprint files
      - name: Build the package
        run: uv run just build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # only this job may publish (trusted publishing)
  publish:
    needs: [build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # mandatory for trusted publishing
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish the package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
